
# Replace this value whenever your active Lovable account
# is connected to a different GitHub source repository.
source_repo: https://github.com/empirialprops/empirial-victorious
source_branch: main
target_branch: victusloveablemain

include_paths:
  - src/**
  - public/**
  - index.html
  - package.json
  - tsconfig*.json
  - vite.config.ts
  - tailwind.config.ts
  - postcss.config.js
  - components.json
  - bun.lockb
  - bun.lock

exclude_paths:
  - .github/**
  - .lovable-sync.yml
  - .env
  - .env.*
  - Dockerfile
  - Dockerfile.production
  - package-lock.json
  - scripts/**

pr:
  labels:
    - lovable-sync
    - automated
  assignees: []
  auto_merge: false
