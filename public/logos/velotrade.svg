<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="veloBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="veloTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <linearGradient id="veloAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.75" />
    </linearGradient>
    <filter id="veloGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="200" height="200" rx="44" fill="url(#veloBg)" stroke="#1f2937" stroke-width="2" />

  <!-- Dynamic Geometric 'V' Monogram (Velocity & Prop Trading Chevron) -->
  <g transform="translate(10, 8)">
    <!-- Soft Glow Behind Wing -->
    <path d="M 45 48 L 78 48 L 90 120 L 70 120 Z" fill="#00f2fe" opacity="0.15" filter="url(#veloGlow)" />
    
    <!-- Left Wing (Velocity Slash) -->
    <path d="M 42 46 L 68 46 L 90 128 L 72 128 Z" fill="url(#veloTeal)" />

    <!-- Center/Right Forward Wing -->
    <path d="M 138 46 L 112 46 L 82 128 L 100 128 Z" fill="url(#veloAccent)" />

    <!-- Upper Fast Horizon Arrow -->
    <polygon points="122,54 146,54 134,80 110,80" fill="url(#veloTeal)" opacity="0.85" />
    
    <!-- Speed Horizon Notch -->
    <polygon points="104,88 124,88 116,104 96,104" fill="#00f2fe" opacity="0.9" />
  </g>

  <!-- Brand Typography Subtitle -->
  <text x="100" y="166" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="16" 
        font-weight="800" 
        letter-spacing="4.5" 
        fill="#ffffff" 
        text-anchor="middle">
    VELOTRADE
  </text>
  <text x="100" y="181" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="9" 
        font-weight="600" 
        letter-spacing="2" 
        fill="#38bdf8" 
        text-anchor="middle">
    PRO TRADING
  </text>
</svg>
